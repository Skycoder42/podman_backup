name: podman_backup
description: A small dart tool to push regular backups of podman volumes to a remote.
homepage: https://github.com/Skycoder42/podman_backup
version: 1.4.4
publish_to: none

environment:
  sdk: ^3.13.0

platforms:
  linux:

executables:
  podman-backup: podman_backup

dependencies:
  args: ^2.7.0
  build_cli_annotations: ^2.1.1
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.19.0
  posix: ^6.5.2
  rxdart: ^0.28.0

dev_dependencies:
  build_cli: ^2.2.13
  build_runner: ^2.16.1
  dart_pre_commit: ^6.1.4
  dart_test_tools: ^7.3.2
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  test: ^1.32.0

aur:
  maintainer: Skycoder42 <Skycoder42@users.noreply.github.com>
  license: BSD
  depends:
    - podman
    - xz
    - systemd
  makedeb:
    depends:
      - podman
      - xz-utils
      - systemd

dart_pre_commit:
  flutter-compat: false

cider:
  link_template:
    tag: https://github.com/Skycoder42/podman_backup/releases/tag/v%tag%
    diff: https://github.com/Skycoder42/podman_backup/compare/v%from%...v%to%
