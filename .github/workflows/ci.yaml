name: Continuous integration

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      buildRunner: true
      unitTestPaths: -P unit
      coverageExclude: >-
        "**/*.freezed.dart"
        "**/*.g.dart"
        "lib/gen/package_metadata.dart"
      integrationTestPaths: -P integration
      integrationTestSetup: >-
        {
          "linux": "./tool/integration-test-setup.sh"
        }

  build:
    name: CD - Build
    needs:
      - ci
    uses: Skycoder42/dart_test_tools/.github/workflows/compile.yml@main
    with:
      enabledPlatforms: ${{ needs.ci.outputs.enabledPlatforms }}
      buildRunner: true

  package:
    name: CD - Build
    needs:
      - build
    uses: Skycoder42/dart_test_tools/.github/workflows/nfpm.yml@main

  release:
    name: CD - Deploy
    needs:
      - package
    uses: Skycoder42/dart_test_tools/.github/workflows/create-release.yml@main
    permissions:
      contents: write

  aur_deploy:
    name: CD - Deploy
    needs:
      - release
    if: needs.release.outputs.releaseCreated == 'true'
    uses: Skycoder42/dart_test_tools/.github/workflows/aur.yml@main
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  deb_deploy:
    name: CD - Deploy
    needs:
      - release
    if: needs.release.outputs.releaseCreated == 'true'
    uses: Skycoder42/dart_test_tools/.github/workflows/deploy-packagecloud.yml@main
    with:
      packagecloudRepository: podman_backup/ubuntu
    secrets:
      packagecloudToken: ${{ secrets.PACKAGECLOUD_TOKEN }}
